[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Původní WordPress URL → nové stránky
[[redirects]]
  from = "/realizace-kuchyni-a-nabytku-na-miru/hledame-sikovneho-truhlare/*"
  to = "/hledame-sikovneho-truhlare/"
  status = 301

[[redirects]]
  from = "/realizace-kuchyni-a-nabytku-na-miru/*"
  to = "/realizace/"
  status = 301

[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
